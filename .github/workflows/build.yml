# Cloud build: every push to main (game files) builds the game for Android (APK) and the web (WebGL), using GameCI.
# Needs repository secrets UNITY_LICENSE (contents of the .ulf file), UNITY_EMAIL, UNITY_PASSWORD (all set).
name: Build game
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths: ['Assets/**', 'Packages/**', 'ProjectSettings/**', '.github/workflows/**']
  workflow_dispatch: {}

# a newer push cancels an older run that is still building (saves build minutes)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # fast C# syntax check (~1 min): a typo fails here instead of after 15 minutes of Unity build
  check:
    name: C# syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: cd Tools/SyntaxCheck && dotnet run -c Release -- ../../Assets

  build:
    name: Build ${{ matrix.targetPlatform }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: [Android, WebGL]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Packages/**', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-
      - name: Free disk space (the Unity build image is large)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: F2Racing
          buildMethod: BuildScript.Build
      - uses: actions/upload-artifact@v4
        with:
          name: F2Racing-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
          retention-days: 14
      # stable download link: every successful build replaces the files on the "latest" release
      - name: Publish to the "latest" release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/${{ matrix.targetPlatform }}
          if [ "${{ matrix.targetPlatform }}" = "Android" ]; then f=F2Racing.apk; else zip -qr "$RUNNER_TEMP/F2Racing-WebGL.zip" . && f="$RUNNER_TEMP/F2Racing-WebGL.zip"; fi
          # main -> "latest"; any other branch (manual run) -> a release named after the branch, so tests never replace "latest"
          tag=latest; [ "${{ github.ref_name }}" != "main" ] && tag="${{ github.ref_name }}"
          gh release view "$tag" -R ${{ github.repository }} >/dev/null 2>&1 || gh release create "$tag" -R ${{ github.repository }} --target "${{ github.sha }}" --title "Build: $tag" --notes "Newest successful build of $tag (updated automatically)." --prerelease
          gh release upload "$tag" "$f" -R ${{ github.repository }} --clobber
